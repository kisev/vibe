name: Lint Rust

on:
    # push:
    #   branches:
    #     - main
    pull_request:
        paths:
            - '.github/workflows/lint.yml'
            - 'desktop/src-tauri/**'
            - 'cli/src/**'
    workflow_dispatch:

env:
    RUST_BACKTRACE: 1
    CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    fmt:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: install Rust stable and rustfmt
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Run the format check
              run: mise exec -- task rust:fmt-check

    clippy:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4
            - name: install Rust stable and clippy
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: Fetch the sidecars
              env:
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task setup

            - name: install node deps
              run: pnpm install
              working-directory: ./desktop

            - uses: Swatinem/rust-cache@v2

            # `task rust:clippy` builds the frontend, stages the diarization
            # helper (which links the prebuilt ggml libraries) and runs clippy
            # with the same flags `task verify` uses locally.
            - name: Fetch the prebuilt ggml libraries
              run: mise exec -- task libs:fetch

            - name: Run clippy
              run: mise exec -- task rust:clippy
