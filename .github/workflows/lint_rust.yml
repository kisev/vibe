name: Lint Rust

on:
    # push:
    #   branches:
    #     - main
    pull_request:
        paths:
            - '.github/workflows/lint.yml'
            - 'desktop/src-tauri/**'
            - 'cli/src/**'
    workflow_dispatch:

permissions:
    contents: read

env:
    RUST_BACKTRACE: 1
    CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Rustfmt is not repeated here: lint.yml runs `task rust:fmt-check` on every
    # push to main and every pull request, without path filters.
    clippy:
        runs-on: macos-latest
        timeout-minutes: 45
        env:
            # Setup mise installs only `task`; the compile toolchain comes from
            # the actions below.
            MISE_EXEC_AUTO_INSTALL: "false"

        steps:
            - uses: actions/checkout@v4
            - name: install Rust stable and clippy
              uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
              with:
                  components: clippy
            - name: setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup mise
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: setup uv
              uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

            - name: Fetch the sidecars
              env:
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task setup

            - name: install node deps
              run: pnpm install
              working-directory: ./desktop

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

            # `task rust:clippy` builds the frontend, stages the diarization
            # helper (which links the prebuilt ggml libraries) and runs clippy
            # with the same flags `task verify` uses locally.
            - name: Fetch the prebuilt ggml libraries
              env:
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task libs:fetch

            - name: Run clippy
              run: mise exec -- task rust:clippy
