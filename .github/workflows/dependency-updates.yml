# Weekly dependency PRs. Renovate is self-hosted here because the repository
# does not use the Renovate app; it needs the RENOVATE_TOKEN secret.
#
# The token is a fine-grained personal access token with:
#   - Contents: read and write
#   - Pull requests: read and write
# It must be added as the repository secret RENOVATE_TOKEN. Without it the run
# fails loudly instead of silently skipping a week.
name: Dependency Updates

on:
    schedule:
        # Off the top of the hour: GitHub delays or drops schedule events that
        # land on :00 under load, and a dropped run is a week without updates.
        - cron: "23 5 * * 1"
    workflow_dispatch:

permissions:
    # The checkout needs read; Renovate opens its PRs through RENOVATE_TOKEN,
    # which carries its own contents and pull-requests write access.
    contents: read

jobs:
    renovate:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check RENOVATE_TOKEN
              env:
                  RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
              run: |
                  if [ -z "$RENOVATE_TOKEN" ]; then
                      echo "::error::RENOVATE_TOKEN is not set. Add a fine-grained token with contents and pull-requests write access as the repository secret RENOVATE_TOKEN."
                      exit 1
                  fi

            - name: Renovate
              # v41.0.22, pinned to a commit SHA: this job runs on a schedule with
              # a PAT and no reviewer sees the code it downloads.
              uses: renovatebot/github-action@8ac70de2fe55752c573155866e30735411e3b61c # v41.0.22
              with:
                  token: ${{ secrets.RENOVATE_TOKEN }}
                  # Same version as mise.toml, so a local dry run matches this run.
                  renovate-version: 44.234.1
              env:
                  RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
                  RENOVATE_CONFIG_FILE: renovate.json
                  # Self-hosted Renovate does not autodiscover repositories, and
                  # without an explicit one it logs "No repositories found" and
                  # exits 0 — a green job that updated nothing. With the list
                  # set, an unreachable repository is a logged error and a
                  # non-zero exit, so a broken token or missing config fails
                  # this job instead of skipping the week.
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
                  LOG_LEVEL: info
