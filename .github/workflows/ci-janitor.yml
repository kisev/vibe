# GitHub's runner pools occasionally kill jobs mid-flight (the macOS pool spent
# 2026-10-26 cancelling random jobs at exactly 15:01 with no logs — proven by a
# bare-heartbeat probe). A killed runner never runs its own steps, so the only
# thing that can react is something watching from outside: this janitor re-runs
# the failed jobs the way a human would. Latest-run only — a dry test of a
# 24h-window rule showed it resurrecting deliberately cancelled debug runs —
# capped at 3 attempts. Lint is deliberately not covered: its failures are
# content failures, and auto-retrying them would paint broken code green.
#
# The primary trigger is the failure itself: workflow_run fires the moment a
# Dev Build or Deploy Website run completes red, and the heal is immediate. A
# schedule cannot be the primary — the first real incident proved it. GitHub
# silently dropped every */30 firing after 18:59Z on 2026-10-28 (the janitor's
# actual cadence over its whole history was 3.6–7.3h), so dev.48's 19:19Z
# runner-queue kill stayed unhealed until the next tag restored the invariant
# four hours later. A daily cron remains as the backstop for completions the
# event might miss. Both paths heal `failure` and `cancelled` alike: the
# 2026-10-26 pool incident cancelled its jobs, which is indistinguishable from
# a deliberate cancel — resurrecting one is the bounded (attempt-capped) price
# of catching pool kills.
name: CI janitor

on:
    workflow_run:
        workflows: [Dev Build, Deploy Website]
        types: [completed]
    schedule:
        - cron: '17 4 * * *'
    workflow_dispatch:

permissions:
    actions: write

jobs:
    heal:
        # Green completions fire workflow_run too; don't spend a runner on them.
        if: github.event_name != 'workflow_run' || contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Re-run infra-killed release jobs
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  rerun_if_needed() {
                      read -r st concl attempt <<< "$(gh api "repos/$REPO/actions/runs/$1" \
                          --jq '"\(.status) \(.conclusion // "-") \(.run_attempt)"' 2>/dev/null)"
                      echo "run $1 [$st/$concl] attempt $attempt"
                      if [ "$st" != "completed" ]; then
                          echo "  running — left alone"
                          return
                      fi
                      if [ "$concl" = "success" ] || [ "$concl" = "skipped" ]; then
                          echo "  green — nothing to heal"
                          return
                      fi
                      if [ "$attempt" -ge 3 ]; then
                          echo "  cap: attempt $attempt, left for a human"
                          return
                      fi
                      if gh run rerun "$1" -R "$REPO" --failed; then
                          echo "  healed: rerunning the failed jobs of $1"
                      else
                          echo "  skip: rerun refused (likely already running)"
                      fi
                  }
                  if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
                      echo "trigger: ${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.id }} finished ${{ github.event.workflow_run.conclusion }}"
                      rerun_if_needed "${{ github.event.workflow_run.id }}"
                  else
                      for wf in dev-build.yml website.yml; do
                          run_id=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" \
                              --jq '.workflow_runs[0].id // empty' 2>/dev/null)
                          [ -z "$run_id" ] && continue
                          rerun_if_needed "$run_id"
                      done
                  fi
                  echo "janitor sweep done"
