# One lint gate, shared by hooks and CI: the same mise pins, the same task
# facade. A green local `task lint` means the same commands ran here. The
# frontend unit suites ride along so a push exercises what pre-push does
# locally; server tests have their own server-test.yml.
name: Lint

on:
    push:
        branches: [main]
    pull_request:
    # A dev revision is linted in place before it is tagged: `gh workflow run
    # lint.yml --ref dev`. Nothing is built or published on a dev push, so this
    # is the only way to compile that revision in CI.
    workflow_dispatch:

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        timeout-minutes: 30
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
              with:
                  install: true
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

            # Clippy below compiles the whole server workspace; without a cache
            # every push rebuilds its dependencies from scratch.
            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: server

            # clippy compiles the engine with GGML_VULKAN=ON since the Vulkan
            # backend landed, so the lint runner needs the same build
            # prerequisites as the dev and release builds (noble ships them
            # all in apt). The runner's DNS flakes often enough that a single
            # apt call has failed whole lints; retry the pair, but bound every
            # call so a hanging resolver cannot eat the job's 30 minutes.
            - name: Install Vulkan build prerequisites
              run: mise exec -- task ci:vulkan-deps

            # Clippy covers the whole server workspace, including the dormant
            # upstream crates: ggml-rs-sys's build script wants the prebuilt
            # ggml libraries (upstream's setup step fetches these; the pin
            # is read from server/libs so a bump never rots this step).
            - name: Fetch the prebuilt ggml libraries
              env:
                  TRIPLE: x86_64-unknown-linux-gnu
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task ci:ggml-libs

            - name: Lint the tree
              run: mise exec -- task lint format:check

            - name: Rust format check
              run: mise exec -- task rust:fmt-check

            - name: Server clippy
              run: mise exec -- task server:clippy

            - name: Server dependency gates
              run: mise exec -- task server:deny server:machete

    frontend-tests:
        timeout-minutes: 20
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
              with:
                  install: true
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  package_json_file: desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      desktop/pnpm-lock.yaml
                      website/pnpm-lock.yaml

            - name: Install frontend dependencies
              run: mise exec -- task ci:frontend-deps

            - name: Frontend unit tests
              run: mise exec -- task desktop:test website:test

    # Windows-only link failures of the server tree cannot surface anywhere
    # else in CI before a dev build — this job links the native-stack helper
    # on a real Windows runner, so an unresolved import is a red Lint run,
    # never a burned dev tag (dev.64 taught us: ggml-cpu needs advapi32).
    helper-link-check:
        timeout-minutes: 20
        runs-on: windows-latest
        env:
            # Setup mise installs only `task`; this job does not need the
            # lint/format toolchain.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
              with:
                  target: x86_64-pc-windows-msvc

            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: server

            - name: Fetch the prebuilt ggml libraries
              shell: bash
              env:
                  TRIPLE: x86_64-pc-windows-msvc
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task ci:ggml-libs

            - name: Link the native diarization helper
              shell: bash
              run: cargo build --manifest-path server/Cargo.toml -p vibe-diarize-native --target x86_64-pc-windows-msvc

    # The release channel is not a compile gate. Dev machines without the GTK
    # stack get their first desktop Rust compile HERE — on every push to main,
    # minutes after the push — so a dev tag is only ever cut from a revision
    # whose desktop crate compiles. Windows-only blocks are not compiled here;
    # they still reach a compiler only in dev-build and release.
    #
    # macOS is in the matrix for one reason: the crate's macOS-only blocks
    # compile nowhere else, and four dev releases in a row (dev.81–dev.84) went
    # out with every macOS cell failing on a `bail!` that crate never imported
    # while every other cell was green. The check costs minutes; a failed
    # release costs a matrix and a janitor rerun chain.
    desktop-check:
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest]
        runs-on: ${{ matrix.os }}
        env:
            # Setup mise installs only `task`; this job does not need the
            # lint/format toolchain.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: desktop/src-tauri

            # The GTK/WebKit headers the crate's Linux build needs; macOS ships
            # its own SDK, so the step is Linux-only.
            - name: Install desktop build prerequisites
              if: runner.os == 'Linux'
              run: mise exec -- task ci:desktop-build-deps

            - name: Type-check the desktop crate
              run: mise exec -- task ci:desktop-check
