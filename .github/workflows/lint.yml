# One lint gate, shared by hooks and CI: the same mise pins, the same task
# facade. A green local `task lint` means the same commands ran here. The
# frontend unit suites ride along so a push exercises what pre-push does
# locally; server tests have their own server-test.yml.
name: Lint

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        timeout-minutes: 30
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@stable

            # clippy compiles the engine with GGML_VULKAN=ON since the Vulkan
            # backend landed, so the lint runner needs the same build
            # prerequisites as the dev and release builds (noble ships them
            # all in apt). The runner's DNS flakes often enough that a single
            # apt call has failed whole lints; retry the pair, but bound every
            # call so a hanging resolver cannot eat the job's 30 minutes.
            - name: Install Vulkan build prerequisites
              run: mise exec -- task ci:vulkan-deps

            # Clippy covers the whole server workspace, including the dormant
            # upstream crates: ggml-rs-sys's build script wants the prebuilt
            # ggml libraries (upstream's `chore setup` fetches these; the pin
            # is read from server/libs so a bump never rots this step).
            - name: Fetch the prebuilt ggml libraries
              env:
                  TRIPLE: x86_64-unknown-linux-gnu
              run: mise exec -- task ci:ggml-libs

            - name: Lint the tree
              run: mise exec -- task lint format:check

            - name: Rust format check
              run: cargo fmt --all -- --check

            - name: Server clippy
              run: mise exec -- task server:clippy

            - name: Server dependency gates
              run: mise exec -- task server:deny server:machete

    frontend-tests:
        timeout-minutes: 20
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      desktop/pnpm-lock.yaml
                      website/pnpm-lock.yaml

            - name: Install frontend dependencies
              run: mise exec -- task ci:frontend-deps

            - name: Frontend unit tests
              run: mise exec -- task desktop:test website:test

    # Windows-only link failures of the server tree cannot surface anywhere
    # else in CI before a dev build — this job links the native-stack helper
    # on a real Windows runner, so an unresolved import is a red Lint run,
    # never a burned dev tag (dev.64 taught us: ggml-cpu needs advapi32).
    helper-link-check:
        timeout-minutes: 20
        runs-on: windows-latest
        env:
            # Setup mise installs only `task`; this job does not need the
            # lint/format toolchain.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: task
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  target: x86_64-pc-windows-msvc

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            - name: Fetch the prebuilt ggml libraries
              shell: bash
              env:
                  TRIPLE: x86_64-pc-windows-msvc
              run: mise exec -- task ci:ggml-libs

            - name: Link the native diarization helper
              shell: bash
              run: cargo build --manifest-path server/Cargo.toml -p vibe-diarize-native --target x86_64-pc-windows-msvc

    # The release channel is not a compile gate. Dev machines without the GTK
    # stack (and any host, for Windows-only code paths) get their first desktop
    # Rust compile HERE — on every push to main, minutes after the push — so a
    # dev tag is only ever cut from a revision whose desktop crate compiles.
    desktop-check:
        timeout-minutes: 25
        runs-on: ubuntu-24.04
        env:
            # Setup mise installs only `task`; this job does not need the
            # lint/format toolchain.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: task
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: desktop/src-tauri

            - name: Install desktop build prerequisites
              run: mise exec -- task ci:desktop-build-deps

            - name: Type-check the desktop crate
              run: mise exec -- task ci:desktop-check
