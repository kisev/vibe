# One lint gate, shared by hooks and CI: the same mise pins, the same task
# facade. A green local `task lint` means the same commands ran here. The
# frontend unit suites ride along so a push exercises what pre-push does
# locally; server tests have their own server-test.yml.
name: Lint

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        timeout-minutes: 30
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  cache: true

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@stable

            # clippy compiles the engine with GGML_VULKAN=ON since the Vulkan
            # backend landed, so the lint runner needs the same build
            # prerequisites as the dev and release builds (noble ships them
            # all in apt).
            - name: Install Vulkan build prerequisites
              run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc glslang-tools spirv-headers

            - name: Lint the tree
              run: mise exec -- task lint format:check

            - name: Rust format check
              run: cargo fmt --all -- --check

            - name: Server clippy
              run: mise exec -- task server:clippy

            - name: Server dependency gates
              run: mise exec -- task server:deny server:machete

    frontend-tests:
        timeout-minutes: 20
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      desktop/pnpm-lock.yaml
                      website/pnpm-lock.yaml

            - name: Install frontend dependencies
              run: |
                  pnpm --dir desktop install --frozen-lockfile
                  pnpm --dir website install --frozen-lockfile

            - name: Frontend unit tests
              run: mise exec -- task desktop:test website:test

    # The release channel is not a compile gate. Dev machines without the GTK
    # stack (and any host, for Windows-only code paths) get their first desktop
    # Rust compile HERE — on every push to main, minutes after the push — so a
    # dev tag is only ever cut from a revision whose desktop crate compiles.
    desktop-check:
        timeout-minutes: 25
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: desktop/src-tauri

            - name: Install desktop build prerequisites
              run: >
                  sudo apt-get update && sudo apt-get install -y --no-install-recommends
                  pkg-config build-essential libglib2.0-dev libgtk-3-dev
                  libwebkit2gtk-4.1-dev clang cmake libssl-dev libasound2-dev
                  libxdo-dev libayatana-appindicator3-dev

            - name: Type-check the desktop crate
              run: |
                  # tauri's build script wants the frontend dist and the sidecar
                  # binary to exist; both are only real in a release build. The
                  # sidecar is matched with its target-triple suffix.
                  mkdir -p desktop/dist desktop/src-tauri/binaries
                  touch "desktop/src-tauri/binaries/vibe-server-$(rustc -vV | sed -n 's/host: //p')"
                  chmod +x desktop/src-tauri/binaries/*
                  cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-targets
