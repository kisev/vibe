# Engine spike CI (change: adopt-transcribe-cpp): one Linux and one Windows
# runner compile the transcribe.cpp dependency from source (the sys crate's
# cmake build) and run a real inference through the vibe-server binary with
# whisper-tiny. Proves the dependency configures, compiles, and infers on both
# platforms with the stock runner toolchains — no libclang, no SDKs.

name: transcribe-spike

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'server/crates/vibe-server/**'
            - 'server/Cargo.lock'
            - '.github/workflows/transcribe-spike.yml'
    pull_request:
        paths:
            - 'server/crates/vibe-server/**'
            - 'server/Cargo.lock'
            - '.github/workflows/transcribe-spike.yml'

concurrency:
    group: transcribe-spike-${{ github.ref }}
    cancel-in-progress: true

env:
    # Matches the handy-computer catalog entry for whisper-tiny Q5_K_M.
    SPIKE_MODEL_URL: https://huggingface.co/handy-computer/whisper-tiny-gguf/resolve/main/whisper-tiny-Q5_K_M.gguf
    SPIKE_MODEL_SHA256: 72cfa8ee436a635a5b6fb373cc056a828b9efe96d32d6eb8769ed3cc5b429719
    SPIKE_AUDIO_URL: https://github.com/ggml-org/whisper.cpp/raw/master/samples/jfk.wav

jobs:
    spike:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, name: linux-x86_64 }
                    - { os: windows-latest, name: windows-x86_64 }
        runs-on: ${{ matrix.os }}
        name: ${{ matrix.name }}
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            # Build-time Vulkan prerequisites for the ggml backend (the
            # runner's GPU is irrelevant; only the compiler toolchain matters).
            - name: Install Vulkan build prerequisites (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc glslang-tools spirv-headers

            - name: Install Vulkan SDK (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  curl.exe -L --retry 5 -o VulkanSDK.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
                  # choco dropped the vulkansdk package; the LunarG installer is silent via /S
                  ./VulkanSDK.exe /S | Out-Null
                  $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
                  "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            # Compiles the transcribe-cpp-sys dependency (the whole C++ tree)
            # via cmake, then links vibe-server against it.
            - name: Build vibe-server with the engine dependency
              run: cargo build --release -p vibe-server

            - name: No-model server tests
              run: cargo test -p vibe-server --bin vibe-server

            - name: Fetch the spike model and audio
              shell: bash
              run: |
                  curl -sSL -o "$RUNNER_TEMP/whisper-tiny-Q5_K_M.gguf" "$SPIKE_MODEL_URL"
                  echo "$SPIKE_MODEL_SHA256  $RUNNER_TEMP/whisper-tiny-Q5_K_M.gguf" | sha256sum -c -
                  curl -sSL -o "$RUNNER_TEMP/jfk.wav" "$SPIKE_AUDIO_URL"

            - name: Run a real inference through vibe-server
              shell: bash
              run: |
                  exe="target/release/vibe-server"
                  if [[ "${{ runner.os }}" == "Windows" ]]; then exe="${exe}.exe"; fi
                  text="$("$exe" transcribe "$RUNNER_TEMP/whisper-tiny-Q5_K_M.gguf" "$RUNNER_TEMP/jfk.wav" --format json | jq -r .text)"
                  echo "transcript: $text"
                  case "$text" in
                      *fellow*Americans*) echo "reference transcript reproduced" ;;
                      *) echo "::error::unexpected transcript"; exit 1 ;;
                  esac
