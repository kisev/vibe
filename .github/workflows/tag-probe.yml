# Temporary diagnostic: can a workflow triggered by a tag push create a
# release with its GITHUB_TOKEN? Deleted once the question is answered.
name: Tag Probe

on:
    push:
        tags:
            - 'probe-tag-*'

permissions:
    contents: write

jobs:
    probe:
        runs-on: ubuntu-latest
        steps:
            - name: Create and delete a draft release for this tag
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
                  code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
                      -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"probe\",\"draft\":true,\"prerelease\":true}")
                  echo "http=$code"
                  cat body.json
                  echo
                  id=$(python3 -c 'import json;print(json.load(open("body.json")).get("id",""))')
                  if [ -n "$id" ]; then
                    gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
                    echo PROBE_OK
                  else
                    echo PROBE_FAIL
                    exit 1
                  fi
