name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to build and tag, e.g. 1.1.0-rc.1 (default: the version in tauri.conf.json)'
                type: string
                default: ''
            sign-windows:
                description: 'Sign Windows binaries via remote YubiKey'
                type: boolean
                default: false
            sign-macos:
                description: 'Sign and notarize macOS binaries with Apple Developer ID'
                type: boolean
                default: false

jobs:
    publish-tauri:
        timeout-minutes: 120
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                      target_triple: "aarch64-apple-darwin"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                      target_triple: "x86_64-apple-darwin"
                    - platform: "ubuntu-22.04"
                      args: "--target x86_64-unknown-linux-gnu"
                      target_triple: "x86_64-unknown-linux-gnu"
                    - platform: "ubuntu-24.04-arm"
                      args: "--target aarch64-unknown-linux-gnu"
                      target_triple: "aarch64-unknown-linux-gnu"
                    - platform: "windows-latest"
                      args: "--target x86_64-pc-windows-msvc"
                      target_triple: "x86_64-pc-windows-msvc"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            # A candidate is the same build as a release, only its version and
            # tag differ: `X.Y.Z-rc.N` sorts below `X.Y.Z`, which is what keeps
            # Dev → Beta → Release moving forward. See docs/UPDATER.md.
            - name: Apply the version override
              if: inputs.version != ''
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                      echo "::error::release overrides are cut from main only (on $GITHUB_REF)"
                      exit 1
                  fi
                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                      echo "::error::version must be X.Y.Z or X.Y.Z-rc.N, got $VERSION"
                      exit 1
                  fi
                  python3 - <<'PY'
                  import json, os, pathlib
                  path = pathlib.Path("desktop/src-tauri/tauri.conf.json")
                  config = json.loads(path.read_text())
                  config["version"] = os.environ["VERSION"]
                  path.write_text(json.dumps(config, indent=2) + "\n")
                  PY

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: setup chore
              uses: getchore/setup-chore@v1
              with:
                  version: v1.6.0

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install
              working-directory: ./desktop

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: chore linux-deps

            - name: Require release notes for this version
              shell: bash
              run: |
                  version=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')
                  test -f "i18n/changelog/$version.md" || { echo "::error::i18n/changelog/$version.md is missing; write the release notes before releasing"; exit 1; }
            - name: Fetch the sidecars for ${{ matrix.target_triple }}
              run: chore setup ${{ matrix.target_triple }}

            # vibe-diarize-native statically links the prebuilt GGML the native
            # stack is built against; vibe-server stays on transcribe.cpp's GGML.
            # The pin is read from server/libs so a bump never rots this step.
            - name: Fetch the prebuilt ggml libraries
              shell: bash
              run: |
                  triple="${{ matrix.target_triple }}"
                  case "$triple" in
                    aarch64-apple-darwin) asset=darwin-arm64 ;;
                    x86_64-apple-darwin) asset=darwin-x86_64 ;;
                    x86_64-unknown-linux-gnu) asset=linux-x86_64 ;;
                    aarch64-unknown-linux-gnu) asset=linux-aarch64 ;;
                    x86_64-pc-windows-msvc) asset=windows-amd64-msvc ;;
                    *) echo "no ggml libraries asset for $triple" >&2; exit 1 ;;
                  esac
                  tag="libraries-ggml-$(cat server/libs/ggml-version)-r$(cat server/libs/revision)"
                  curl --location --fail --retry 3 -o /tmp/ggml-libs.tar.gz \
                    "https://github.com/thewh1teagle/vibe/releases/download/$tag/ggml-libs-$asset.tar.gz"
                  tar -xzf /tmp/ggml-libs.tar.gz -C /tmp
                  mv /tmp/lib server/libs/lib

            - name: Build the native diarization helper
              shell: bash
              run: |
                  triple="${{ matrix.target_triple }}"
                  exe=""
                  if [[ "$triple" == *windows* ]]; then exe=".exe"; fi
                  cd server
                  cargo build -p vibe-diarize-native --release --target "$triple"
                  cp "target/$triple/release/vibe-diarize-native$exe" \
                    "../desktop/src-tauri/binaries/vibe-diarize-native-$triple$exe"

            - name: Setup macOS signing env
              if: matrix.platform == 'macos-latest' && inputs.sign-macos
              run: |
                  {
                      echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
                      echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
                      echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
                      echo "APPLE_ID=${{ secrets.APPLE_ID }}"
                      echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
                      echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
                  } >> "$GITHUB_ENV"

            - name: Build
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # Tauri Updater
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  # Analytics (Aptabase)
                  APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
                  APTABASE_BASE_URL: ${{ secrets.APTABASE_BASE_URL }}
                  # Windows signing (remote YubiKey sign server)
                  SIGN_ENABLED: ${{ matrix.platform == 'windows-latest' && inputs.sign-windows && 'true' || 'false' }}
                  SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
                  SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}
              with:
                  tagName: v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
                  releaseName: "v__VERSION__"
                  releaseBody: "Release notes: https://kisev.github.io/vibe/changelog/__VERSION__"
                  prerelease: true
                  args: ${{ matrix.args }} ${{ matrix.platform == 'windows-latest' && inputs.sign-windows && '--config src-tauri/tauri.windows.signing.conf.json' || '' }}
                  projectPath: "./desktop"
                  tauriScript: pnpm exec tauri
