name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to build and tag, e.g. 1.1.0-rc.1 (default: the version in tauri.conf.json)'
                type: string
                default: ''
            sign-windows:
                description: 'Sign Windows binaries via remote YubiKey'
                type: boolean
                default: false
            sign-macos:
                description: 'Sign and notarize macOS binaries with Apple Developer ID'
                type: boolean
                default: false

jobs:
    publish-tauri:
        timeout-minutes: 120
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                      target_triple: "aarch64-apple-darwin"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                      target_triple: "x86_64-apple-darwin"
                    - platform: "ubuntu-22.04"
                      args: "--target x86_64-unknown-linux-gnu"
                      target_triple: "x86_64-unknown-linux-gnu"
                    - platform: "ubuntu-24.04-arm"
                      args: "--target aarch64-unknown-linux-gnu"
                      target_triple: "aarch64-unknown-linux-gnu"
                    - platform: "windows-latest"
                      args: "--target x86_64-pc-windows-msvc"
                      target_triple: "x86_64-pc-windows-msvc"

        runs-on: ${{ matrix.platform }}
        env:
            # Setup mise installs only `task`; do not let `mise exec` pull the
            # rest of the toolchain into every matrix cell.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            # A candidate is the same build as a release, only its version and
            # tag differ: `X.Y.Z-rc.N` sorts below `X.Y.Z`, which is what keeps
            # Dev → Beta → Release moving forward. See docs/reference/update-channels.md.
            - name: Apply the version override
              if: inputs.version != ''
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: mise exec -- task release:set-version

            # The prerelease carries the same body a promotion will: the
            # versioned English entry under the website link line. A link-only
            # placeholder is what let a stable release ship without its notes.
            - name: Assemble the release body
              id: release-notes
              shell: bash
              run: mise exec -- task release:notes -- --github-output

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install
              working-directory: ./desktop

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: mise exec -- task linux-deps

            - name: Require release notes for this version
              shell: bash
              run: mise exec -- task ci:changelog-gate
            - name: Fetch the sidecars for ${{ matrix.target_triple }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task setup -- ${{ matrix.target_triple }}

            # vibe-diarize-native statically links the prebuilt GGML the native
            # stack is built against; vibe-server stays on transcribe.cpp's GGML.
            # The pin is read from server/libs so a bump never rots this step.
            - name: Fetch the prebuilt ggml libraries
              shell: bash
              env:
                  TRIPLE: ${{ matrix.target_triple }}
                  GH_TOKEN: ${{ github.token }}
              run: mise exec -- task ci:ggml-libs

            - name: Build the native diarization helper
              shell: bash
              env:
                  TRIPLE: ${{ matrix.target_triple }}
                  EXE: ${{ contains(matrix.target_triple, 'windows') && '.exe' || '' }}
              run: mise exec -- task ci:diarize-helper

            - name: Setup macOS signing env
              if: matrix.platform == 'macos-latest' && inputs.sign-macos
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: mise exec -- task ci:macos-signing-env

            - name: Build
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # Tauri Updater
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  # Windows signing (remote YubiKey sign server)
                  SIGN_ENABLED: ${{ matrix.platform == 'windows-latest' && inputs.sign-windows && 'true' || 'false' }}
                  SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
                  SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}
              with:
                  tagName: v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
                  releaseName: "v__VERSION__"
                  # Assembled above with `task release:notes`: the versioned
                  # English notes under the same line, so the candidate body is
                  # never a link-only placeholder.
                  releaseBody: ${{ steps.release-notes.outputs.body }}
                  prerelease: true
                  args: ${{ matrix.args }} ${{ matrix.platform == 'windows-latest' && inputs.sign-windows && '--config src-tauri/tauri.windows.signing.conf.json' || '' }}
                  projectPath: "./desktop"
                  tauriScript: pnpm exec tauri
