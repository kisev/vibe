name: Deploy Website

# One deploy publishes two builds: the release site at /vibe/ from main and the
# dev preview at /vibe/dev/ from dev. A push to either branch that touches the
# site (or a manual dispatch) rebuilds both, so the preview is always the current
# dev tree and the release site only moves when main does.
on:
    push:
        branches:
            - main
            - dev
        paths:
            - "website/**"
            - "i18n/**"
            - "openspec/changes/**"
            - "scripts/roadmap.py"
            - "scripts/dev_manifest.py"
            - "scripts/website_build.sh"
            - "scripts/website_assemble.sh"
            - "scripts/website_links.py"
            - "handoff/pwa/**"
            - "handoff/wasm/**"
            - "taskfile.yml"
            - ".github/workflows/website.yml"
    # No `release` trigger: the github-pages environment's branch policy admits
    # branches, so a tag ref fails the deploy job before its first step, and a dev
    # tag would publish the dev branch. A release's content reaches the site
    # through the main push that precedes it; workflow_dispatch covers the rest.
    workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # The phone handoff ships with the release site, which is built from main.
    # Main only carries it once a release includes it, so ask before building:
    # a release line without the handoff simply serves no /phone/.
    probe:
        runs-on: ubuntu-latest
        outputs:
            present: ${{ steps.probe.outputs.present }}
        steps:
            - name: Checkout main
              uses: actions/checkout@v4
              with:
                  ref: main

            # Inline on purpose: the checkout under test is main, which carries
            # neither this workflow's newer steps nor any probe script of its
            # own — a `task` or script call here would test the wrong tree.
            - name: Does the release line carry the phone handoff?
              id: probe
              run: |
                  if grep -q '^  phone:pwa:' taskfile.yml && [ -f handoff/pwa/package.json ]; then
                    echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "present=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::main carries no phone handoff; the release site ships without /phone/"
                  fi

    # Built on Linux on purpose: the iroh client pulls in `ring`, which compiles C
    # for wasm32, and the macOS runners' Apple clang has no wasm target.
    pwa:
        needs: probe
        if: needs.probe.outputs.present == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # The phone handoff is served from the release site, so it is
                  # built from main even when a dev push started this run.
                  ref: main

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: handoff/pwa/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: handoff/wasm

            - name: install wasm-bindgen-cli
              uses: taiki-e/install-action@v2
              with:
                  # Must match the pinned `wasm-bindgen` dependency in handoff/wasm/Cargo.toml
                  # exactly, or the CLI refuses to process the module.
                  tool: wasm-bindgen-cli@0.2.122

            # Pinned, not apt: the distro binaryen is older and produces a
            # different module, which is how a broken wasm shipped once already.
            - name: install binaryen
              run: |
                curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz | tar xz
                echo "$PWD/binaryen-version_132/bin" >> "$GITHUB_PATH"

            - name: setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Build
              run: mise exec -- task phone:pwa -- /vibe/phone/

            - name: Upload phone PWA
              uses: actions/upload-artifact@v4
              with:
                  name: pwa-dist
                  path: handoff/pwa/dist
                  if-no-files-found: error

    build:
        needs: [probe, pwa]
        # The site deploy must not hinge on the phone job: a release line
        # without the handoff skips `pwa` and still publishes the two sites.
        if: ${{ !cancelled() && needs.probe.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main
              uses: actions/checkout@v4
              with:
                  ref: main

            # The release site's content comes from main, its pipeline from dev.
            # Main lags a release behind: right after a rollback it carries no
            # `website:build` task, no assembly script and no uv project at all,
            # and using its own taskfile failed the deploy with "task does not
            # exist" before the Python helpers failed on a missing httpx.
            - name: Take the deploy pipeline from dev
              run: |
                  git fetch --depth 1 origin dev
                  git checkout FETCH_HEAD -- taskfile.yml scripts/ pyproject.toml uv.lock

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: website/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: website/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Build production site
              run: mise exec -- task website:build
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Download phone PWA
              if: needs.probe.outputs.present == 'true'
              uses: actions/download-artifact@v5
              with:
                  name: pwa-dist
                  path: website/dist/phone

            # A separate checkout path keeps the production build intact: the
            # default checkout would clean untracked files, dist included.
            - name: Checkout dev
              uses: actions/checkout@v4
              with:
                  ref: dev
                  path: dev-src

            - name: Build dev site
              working-directory: dev-src
              run: mise exec -- task website:build:dev
              env:
                  GH_TOKEN: ${{ github.token }}

            # Run from the dev checkout: dev is the integration branch, so it
            # carries the current deploy pipeline even while main still lags a
            # release behind.
            - name: Assemble the deploy artifact
              working-directory: dev-src
              env:
                  WEBSITE_PROD_DIR: ../website/dist
                  WEBSITE_DEV_DIR: website/dist-dev
                  WEBSITE_SITE_DIR: ../website/dist-site
              run: mise exec -- task website:assemble

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload Artifacts
              uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist-site

    deploy:
        needs: build
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
