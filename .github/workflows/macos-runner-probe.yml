# Temporary diagnostic for the dev.41 macOS cancellations: both cells die
# silently at exactly 15:01 with no logs (BlobNotFound), three attempts in a
# row, while Linux and Windows cells in the same runs complete fine. This
# probe runs a bare heartbeat on the same runner image for longer than that
# wall — if it also dies at 15:01, the problem is GitHub's macOS pool; if it
# survives, the problem is in dev-build's macOS job path. Delete after use.
name: macOS runner probe

on:
    workflow_dispatch:

jobs:
    heartbeat:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      triple: aarch64-apple-darwin
                    - runner: macos-latest
                      triple: x86_64-apple-darwin
        steps:
            - name: Heartbeat for 19 minutes
              run: |
                  uname -m
                  for i in $(seq 1 19); do
                      echo "beat $i $(date -u +%H:%M:%SZ)"
                      sleep 60
                  done
                  echo "survived past the 15-minute wall"
