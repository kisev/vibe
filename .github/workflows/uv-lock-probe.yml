# Temporary: generate uv.lock where PyPI is reachable and publish it as an
# artifact. Removed once the lock is committed.
name: Lock Probe

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lock:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: dev
            - uses: astral-sh/setup-uv@v6
            - name: Resolve the lockfile
              run: uv lock
            - name: Smoke the project environment
              run: |
                  uv run python -c "import bs4, curl_cffi, flask, httpx, pandas, pyarrow, jwt, pyperclip, dotenv; print('imports ok')"
                  uv run scripts/channel.py --self-test
                  uv lock --check
            - uses: actions/upload-artifact@v4
              with:
                  name: uv-lock
                  path: uv.lock
