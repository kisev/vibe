# Dev builds for the fork: every push to main produces unsigned bundles for all
# five release platforms and publishes them to one prerelease per run, tagged
# `dev.<run-number>`; the release name carries the application version with a
# `-dev.<short-commit>` suffix and the body names the full commit SHA.
#
# This is deliberately a separate file from release.yml, which belongs to the
# upstream release flow and stays untouched. The sidecars are built from the
# tree instead of being downloaded from a `server-v*` release, because the
# pinned `.server-version` may name a release that does not exist yet, and the
# build must carry the engine changes on main.
name: Dev Build

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

# Queue runs instead of cancelling: a cancelled matrix would leave the release
# holding a mix of old and new assets.
concurrency:
    group: dev-build-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        timeout-minutes: 90
        # Release-grade LTO is most of a dev build's wall clock; the tracked
        # profile stays as it is for real releases.
        env:
            CARGO_PROFILE_RELEASE_LTO: "false"
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      triple: aarch64-apple-darwin
                      libs: darwin-arm64
                      exe: ""
                      ffmpeg: https://www.osxexperts.net/ffmpeg80arm.zip
                    - runner: macos-latest
                      triple: x86_64-apple-darwin
                      libs: darwin-x86_64
                      exe: ""
                      ffmpeg: https://www.osxexperts.net/ffmpeg80intel.zip
                    - runner: ubuntu-22.04
                      triple: x86_64-unknown-linux-gnu
                      libs: linux-x86_64
                      exe: ""
                    # The aarch64 ggml libraries come from server-libs.yml, which
                    # builds them on 24.04; linking them from 22.04 fails on the
                    # glibc 2.38 string symbols.
                    - runner: ubuntu-24.04-arm
                      triple: aarch64-unknown-linux-gnu
                      libs: linux-aarch64
                      exe: ""
                    - runner: windows-latest
                      triple: x86_64-pc-windows-msvc
                      libs: windows-amd64-msvc
                      exe: .exe
                      ffmpeg: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # macos-latest is arm64; the Intel bundle is cross-compiled here.
                  targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            # The server is its own workspace, so the default root-only cache
            # would leave its dependencies rebuilt on every run.
            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      server -> target
                  # rust-cache keys on the host triple, and both macOS cells run
                  # on the same arm64 runner with different --target values, so
                  # without this they would overwrite each other's cache.
                  key: ${{ matrix.triple }}

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 pkg-config build-essential libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev clang cmake libssl-dev libasound2-dev libxdo-dev libayatana-appindicator3-dev rpm

            - name: Compute the dev version
              id: dev-version
              shell: bash
              run: |
                  base=$(jq -r .version desktop/src-tauri/tauri.conf.json)
                  short=${GITHUB_SHA:0:7}
                  version="$base-dev.$short"
                  # One release per commit: a shared release accumulated assets
                  # from several builds whenever a run failed to finish. The
                  # run number, not the commit, orders the releases page: a
                  # hash in the tag compares randomly and shuffles the page.
                  # A re-run keeps its run number, so its matrix jobs still
                  # share one release.
                  tag="dev.${{ github.run_number }}"
                  # One no-space JSON: tauri-action splits args on whitespace.
                  config=$(jq -cn --arg v "$version" '{
                      version: $v,
                      bundle: { createUpdaterArtifacts: false },
                      plugins: { updater: { endpoints: [] } }
                  }')
                  {
                      echo "version=$version"
                      echo "tag=$tag"
                      echo "config=$config"
                  } >> "$GITHUB_OUTPUT"

            # The release tag is derived from the pinned files so a libs/ bump is
            # picked up without touching this workflow.
            - name: Fetch prebuilt GGML libraries
              shell: bash
              run: |
                  tag="libraries-ggml-$(cat server/libs/ggml-version)-r$(cat server/libs/revision)"
                  url="https://github.com/thewh1teagle/vibe/releases/download/$tag/ggml-libs-${{ matrix.libs }}.tar.gz"
                  echo "fetching $url"
                  # Relative paths only: the Windows runner's GNU tar reads a
                  # drive letter in an absolute path as a remote host.
                  curl -fsSL "$url" -o ggml-libs.tar.gz
                  rm -rf ggml-libs server/libs/lib
                  mkdir -p ggml-libs
                  tar -xzf ggml-libs.tar.gz -C ggml-libs
                  mv ggml-libs/lib server/libs/lib
                  rm -rf ggml-libs ggml-libs.tar.gz

            - name: Build vibe-server
              shell: bash
              env:
                  VIBE_SERVER_VERSION: ${{ steps.dev-version.outputs.version }}
                  VIBE_SERVER_COMMIT: ${{ github.sha }}
              run: |
                  exe="${{ matrix.exe }}"
                  cd server
                  cargo build -p vibe-server --release --target "${{ matrix.triple }}"
                  mkdir -p ../desktop/src-tauri/binaries
                  cp "target/${{ matrix.triple }}/release/vibe-server$exe" \
                     "../desktop/src-tauri/binaries/vibe-server-${{ matrix.triple }}$exe"

            # The version proves the build env reached the crate; the commit is
            # printed by `serve` at startup, so check it is embedded instead of
            # starting a server on every runner.
            - name: Check the server sidecar
              shell: bash
              run: |
                  exe="${{ matrix.exe }}"
                  binary="desktop/src-tauri/binaries/vibe-server-${{ matrix.triple }}$exe"
                  "$binary" --version
                  grep -aq "${{ github.sha }}" "$binary"

            # Linux takes a system ffmpeg; the other platforms bundle one as a
            # sidecar, but only where the model needs it, so this has to match
            # what tauri.*.windows.conf.json and the macOS build expect.
            # Python because the runners' tar differs: macOS has bsdtar, which
            # reads zip; the Windows runner's GNU tar does not.
            - name: Fetch ffmpeg
              if: matrix.ffmpeg != ''
              shell: python
              env:
                  FFMPEG_URL: ${{ matrix.ffmpeg }}
                  TRIPLE: ${{ matrix.triple }}
                  EXE: ${{ matrix.exe }}
              run: |
                  import os
                  import pathlib
                  import urllib.request
                  import zipfile

                  url = os.environ["FFMPEG_URL"]
                  triple = os.environ["TRIPLE"]
                  exe = os.environ["EXE"]
                  tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ffmpeg-download"
                  tmp.mkdir(parents=True, exist_ok=True)
                  archive = tmp / "ffmpeg.zip"
                  urllib.request.urlretrieve(url, archive)
                  with zipfile.ZipFile(archive) as bundle:
                      member = next(
                          name
                          for name in bundle.namelist()
                          if pathlib.PurePosixPath(name).name == "ffmpeg" + exe
                      )
                      bundle.extract(member, tmp / "out")
                  target = pathlib.Path("desktop/src-tauri/binaries") / f"ffmpeg-{triple}{exe}"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  os.replace(tmp / "out" / member, target)
                  os.chmod(target, 0o755)
                  print(f"installed {target}")

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile
              working-directory: ./desktop

            # tauri-action reuses an existing release for the same tag, which is
            # how the five matrix jobs share one release.
            - name: Build and publish
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tagName: ${{ steps.dev-version.outputs.tag }}
                  releaseName: Dev build ${{ steps.dev-version.outputs.version }}
                  releaseBody: "Dev build of main at ${{ github.sha }}."
                  releaseCommitish: ${{ github.sha }}
                  prerelease: true
                  uploadUpdaterJson: false
                  args: --target ${{ matrix.triple }} --config ${{ steps.dev-version.outputs.config }}
                  projectPath: ./desktop
                  tauriScript: pnpm exec tauri
