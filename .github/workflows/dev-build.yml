# Dev builds for the fork: pushing a `dev.<number>` tag produces unsigned
# bundles for all five release platforms and publishes them to one prerelease
# per run, reusing the tag that started it; the release name carries the
# application version with a `-dev.<tag-number>.<short-commit>` suffix and the
# body names the full commit SHA. A plain push to main builds nothing — the
# maintainer decides when five platform jobs are worth running.
#
# This is deliberately a separate file from release.yml, which belongs to the
# upstream release flow and stays untouched. The sidecars are built from the
# tree instead of being downloaded from a `server-v*` release, because the
# pinned `.server-version` may name a release that does not exist yet, and the
# build must carry the engine changes on main.
name: Dev Build

on:
    push:
        tags:
            - 'dev.*'
    workflow_dispatch:

permissions:
    contents: write

# Queue runs instead of cancelling: a cancelled matrix would leave the release
# holding a mix of old and new assets.
concurrency:
    group: dev-build-${{ github.ref }}
    cancel-in-progress: false

jobs:
    guard:
        # Dev builds belong to the dev branch: a dev tag cut anywhere else is a
        # mistake, and so is a manual dispatch on another branch.
        runs-on: ubuntu-latest
        env:
            # Setup mise installs only `task`; do not let `mise exec` pull the
            # rest of the toolchain into jobs that do not lint or format.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true
            - name: The dev tag lives on the dev branch
              shell: bash
              run: mise exec -- task dev:guard

    build:
        needs: guard
        # The cleanup job needs the tag this run published under — tag push
        # and manual dispatch alike.
        outputs:
            tag: ${{ steps.dev-version.outputs.tag }}
        timeout-minutes: 90
        # Release-grade LTO is most of a dev build's wall clock; the tracked
        # profile stays as it is for real releases.
        env:
            CARGO_PROFILE_RELEASE_LTO: "false"
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
            # Setup mise installs only `task`; do not let `mise exec` pull the
            # rest of the toolchain into every matrix cell.
            MISE_EXEC_AUTO_INSTALL: "false"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      triple: aarch64-apple-darwin
                      exe: ""
                      ffmpeg: https://www.osxexperts.net/ffmpeg80arm.zip
                    - runner: macos-latest
                      triple: x86_64-apple-darwin
                      exe: ""
                      ffmpeg: https://www.osxexperts.net/ffmpeg80intel.zip
                    # x86_64 distribution builds pin the portable AVX floor
                    # (SSE4.2 + AVX + F16C): the legacy baseline CPU tier, so one
                    # binary runs on every x86-64 CPU since 2011. Local builds
                    # stay native-tuned; tinyBLAS still runtime-dispatches AVX2
                    # kernels for the matmul hot path.
                    - runner: ubuntu-22.04
                      triple: x86_64-unknown-linux-gnu
                      exe: ""
                      cmake_args: -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF
                    - runner: ubuntu-24.04-arm
                      triple: aarch64-unknown-linux-gnu
                      exe: ""
                    - runner: windows-latest
                      triple: x86_64-pc-windows-msvc
                      exe: .exe
                      cmake_args: -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF
                      ffmpeg: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # macos-latest is arm64; the Intel bundle is cross-compiled here.
                  targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            # The server is its own workspace, so the default root-only cache
            # would leave its dependencies rebuilt on every run.
            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      server -> target
                  # rust-cache keys on the host triple, and both macOS cells run
                  # on the same arm64 runner with different --target values, so
                  # without this they would overwrite each other's cache.
                  key: ${{ matrix.triple }}

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: mise exec -- task ci:linux-build-deps

            - name: Compute the dev version
              id: dev-version
              shell: bash
              run: mise exec -- task dev:prepare

            # ggml's Vulkan backend needs headers + glslc + glslangValidator +
            # SPIRV-Headers cmake config at build time only; the loader comes
            # from the user's GPU driver at runtime. Noble ships all of it in
            # apt, jammy (kept for the older glibc floor) needs the LunarG repo.
            - name: Install Vulkan build prerequisites (noble)
              if: runner.os == 'Linux' && matrix.triple == 'aarch64-unknown-linux-gnu'
              run: mise exec -- task ci:vulkan-noble

            - name: Install Vulkan SDK (jammy)
              if: matrix.triple == 'x86_64-unknown-linux-gnu'
              run: mise exec -- task ci:vulkan-jammy

            - name: Install Vulkan SDK (Windows)
              if: runner.os == 'Windows'
              timeout-minutes: 8
              env:
                  VULKAN_VERSION: 1.4.357.0
              run: mise exec -- task ci:vulkan-sdk-windows

            - name: Build vibe-server
              shell: bash
              env:
                  TRIPLE: ${{ matrix.triple }}
                  EXE: ${{ matrix.exe }}
                  VIBE_SERVER_VERSION: ${{ steps.dev-version.outputs.version }}
                  VIBE_SERVER_COMMIT: ${{ github.sha }}
                  # Empty on the arm64 and macOS cells; the sys crate pins its
                  # own portable floors there. An empty value is a no-op.
                  TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake_args }}
              run: mise exec -- task ci:build-server

            # The version proves the build env reached the crate; the commit is
            # printed by `serve` at startup, so check it is embedded instead of
            # starting a server on every runner.
            - name: Check the server sidecar
              shell: bash
              env:
                  TRIPLE: ${{ matrix.triple }}
                  EXE: ${{ matrix.exe }}
                  GITHUB_SHA: ${{ github.sha }}
              run: mise exec -- task ci:check-server

            # vibe-diarize-native statically links the prebuilt GGML the native
            # stack is built against (the same libraries lint.yml fetches for
            # clippy); vibe-server itself stays on transcribe.cpp's GGML. The
            # pin is read from server/libs so a bump never rots this step.
            - name: Fetch the prebuilt ggml libraries
              shell: bash
              env:
                  TRIPLE: ${{ matrix.triple }}
              run: mise exec -- task ci:ggml-libs

            - name: Build the native diarization helper
              shell: bash
              env:
                  TRIPLE: ${{ matrix.triple }}
                  EXE: ${{ matrix.exe }}
              run: mise exec -- task ci:diarize-helper

            # Linux takes a system ffmpeg; the other platforms bundle one as a
            # sidecar, but only where the model needs it, so this has to match
            # what tauri.*.windows.conf.json and the macOS build expect.
            - name: Fetch ffmpeg
              if: matrix.ffmpeg != ''
              env:
                  FFMPEG_URL: ${{ matrix.ffmpeg }}
                  TRIPLE: ${{ matrix.triple }}
                  EXE: ${{ matrix.exe }}
                  RUNNER_TEMP: ${{ runner.temp }}
              run: mise exec -- task ci:fetch-ffmpeg

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile
              working-directory: ./desktop

            # tauri-action reuses an existing release for the same tag, which is
            # how the five matrix jobs share one release.
            - name: Build and publish
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # The same updater key as release.yml: a dev install verifies
                  # dev artifacts with the pubkey bundled in every build.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  tagName: ${{ steps.dev-version.outputs.tag }}
                  releaseName: Dev build ${{ steps.dev-version.outputs.version }}
                  releaseBody: ${{ steps.dev-version.outputs.body }}
                  releaseCommitish: ${{ github.sha }}
                  prerelease: true
                  includeUpdaterJson: true
                  args: --target ${{ matrix.triple }} --config ${{ steps.dev-version.outputs.config }}
                  projectPath: ./desktop
                  tauriScript: pnpm exec tauri

    # Bounded retention, not a one-release sweep: the newest five dev releases
    # always stay, anything from the last 24 hours stays, and only releases
    # created before this run started are considered at all — a healed older
    # run finishing late must never delete the release a newer dev build just
    # filled. The tags are never touched; they are the history.
    cleanup:
        needs: build
        if: success()
        timeout-minutes: 5
        runs-on: ubuntu-latest
        env:
            # Setup mise installs only `task`; the cleanup does not need the
            # lint/format tools.
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                  install: true
                  install_args: aqua:go-task/task
                  cache: true

            - name: Prune old dev releases, keeping the recent ones
              env:
                  GH_TOKEN: ${{ github.token }}
                  KEEP: ${{ needs.build.outputs.tag }}
                  KEEP_COUNT: "5"
                  KEEP_HOURS: "24"
              run: mise exec -- task dev:cleanup

    # The dev channel manifest is generated at website build time from the
    # newest complete dev prerelease (scripts/dev_manifest.py). Dispatching the
    # deploy here is what makes a fresh dev build reachable by the Dev channel.
    deploy-website:
        needs: [build, cleanup]
        if: success()
        timeout-minutes: 5
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            # Kept inline: extracting this to `task dev:deploy-website` would
            # need a checkout, which this job's actions-only permissions do not
            # grant.
            - name: Refresh the website and its dev manifest
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run website.yml --ref main --repo "$GITHUB_REPOSITORY"
