# Dev builds for the fork: pushing a `dev.<number>` tag produces unsigned
# bundles for all five release platforms and publishes them to one prerelease
# per run, reusing the tag that started it; the release name carries the
# application version with a `-dev.<tag-number>.<short-commit>` suffix and the
# body names the full commit SHA. A plain push to main builds nothing — the
# maintainer decides when five platform jobs are worth running.
#
# This is deliberately a separate file from release.yml, which belongs to the
# upstream release flow and stays untouched. The sidecars are built from the
# tree instead of being downloaded from a `server-v*` release, because the
# pinned `.server-version` may name a release that does not exist yet, and the
# build must carry the engine changes on main.
name: Dev Build

on:
    push:
        tags:
            - 'dev.*'
    workflow_dispatch:

permissions:
    contents: write

# Queue runs instead of cancelling: a cancelled matrix would leave the release
# holding a mix of old and new assets.
concurrency:
    group: dev-build-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        timeout-minutes: 90
        # Release-grade LTO is most of a dev build's wall clock; the tracked
        # profile stays as it is for real releases.
        env:
            CARGO_PROFILE_RELEASE_LTO: "false"
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      triple: aarch64-apple-darwin
                      exe: ""
                      ffmpeg: https://www.osxexperts.net/ffmpeg80arm.zip
                    - runner: macos-latest
                      triple: x86_64-apple-darwin
                      exe: ""
                      ffmpeg: https://www.osxexperts.net/ffmpeg80intel.zip
                    # x86_64 distribution builds pin the portable AVX floor
                    # (SSE4.2 + AVX + F16C): the legacy baseline CPU tier, so one
                    # binary runs on every x86-64 CPU since 2011. Local builds
                    # stay native-tuned; tinyBLAS still runtime-dispatches AVX2
                    # kernels for the matmul hot path.
                    - runner: ubuntu-22.04
                      triple: x86_64-unknown-linux-gnu
                      exe: ""
                      cmake_args: -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF
                    - runner: ubuntu-24.04-arm
                      triple: aarch64-unknown-linux-gnu
                      exe: ""
                    - runner: windows-latest
                      triple: x86_64-pc-windows-msvc
                      exe: .exe
                      cmake_args: -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF
                      ffmpeg: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # macos-latest is arm64; the Intel bundle is cross-compiled here.
                  targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            # The server is its own workspace, so the default root-only cache
            # would leave its dependencies rebuilt on every run.
            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      server -> target
                  # rust-cache keys on the host triple, and both macOS cells run
                  # on the same arm64 runner with different --target values, so
                  # without this they would overwrite each other's cache.
                  key: ${{ matrix.triple }}

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                      pkg-config build-essential libglib2.0-dev libgtk-3-dev \
                      libwebkit2gtk-4.1-dev clang cmake libssl-dev libasound2-dev \
                      libxdo-dev libayatana-appindicator3-dev rpm

            - name: Compute the dev version
              id: dev-version
              shell: bash
              run: |
                  base=$(jq -r .version desktop/src-tauri/tauri.conf.json)
                  short=${GITHUB_SHA:0:7}
                  if [[ "$GITHUB_REF" == refs/tags/dev.* ]]; then
                      # A pushed tag started this run: reuse it, never mint a
                      # second one, and let its number order the release.
                      tag="$GITHUB_REF_NAME"
                      n="${GITHUB_REF_NAME#dev.}"
                  else
                      # Manual dispatch has no tag; the run number keeps the
                      # scheme and still shares one release across re-runs.
                      n="${{ github.run_number }}"
                      tag="dev.$n"
                  fi
                  version="$base-dev.$n.$short"
                  # One no-space JSON: tauri-action splits args on whitespace.
                  config=$(jq -cn --arg v "$version" '{
                      version: $v,
                      bundle: { createUpdaterArtifacts: false },
                      plugins: { updater: { endpoints: [] } }
                  }')
                  # The release body is the accumulated unreleased changelog entry,
                  # so a dev install shows what it carries; GitHub renders the
                  # sections as-is, only the frontmatter drops.
                  if [ -f i18n/changelog/unreleased.md ]; then
                      body=$(awk 'c==2{print} /^---$/{c++}' i18n/changelog/unreleased.md | sed '/./,$!d' | head -c 60000)
                  else
                      body="Dev build of main at ${GITHUB_SHA}."
                  fi
                  {
                      echo "version=$version"
                      echo "tag=$tag"
                      echo "config=$config"
                  } >> "$GITHUB_OUTPUT"
                  # Multiline output; tauri-action publishes it as the release body.
                  {
                      echo "body<<CHANGELOG_EOF"
                      echo "$body"
                      echo "CHANGELOG_EOF"
                  } >> "$GITHUB_OUTPUT"

            # ggml's Vulkan backend needs headers + glslc + glslangValidator +
            # SPIRV-Headers cmake config at build time only; the loader comes
            # from the user's GPU driver at runtime. Noble ships all of it in
            # apt, jammy (kept for the older glibc floor) needs the LunarG repo.
            - name: Install Vulkan build prerequisites (noble)
              if: runner.os == 'Linux' && matrix.triple == 'aarch64-unknown-linux-gnu'
              run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc glslang-tools spirv-headers

            - name: Install Vulkan SDK (jammy)
              if: matrix.triple == 'x86_64-unknown-linux-gnu'
              run: |
                  wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
                  sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
                  sudo apt-get update && sudo apt-get install -y vulkan-sdk

            - name: Install Vulkan SDK (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  choco install -y vulkansdk --no-progress
                  $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
                  "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Build vibe-server
              shell: bash
              env:
                  VIBE_SERVER_VERSION: ${{ steps.dev-version.outputs.version }}
                  VIBE_SERVER_COMMIT: ${{ github.sha }}
                  # Empty on the arm64 and macOS cells; the sys crate pins its
                  # own portable floors there. An empty value is a no-op.
                  TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake_args }}
              run: |
                  exe="${{ matrix.exe }}"
                  cd server
                  cargo build -p vibe-server --release --target "${{ matrix.triple }}"
                  mkdir -p ../desktop/src-tauri/binaries
                  cp "target/${{ matrix.triple }}/release/vibe-server$exe" \
                      "../desktop/src-tauri/binaries/vibe-server-${{ matrix.triple }}$exe"

            # The version proves the build env reached the crate; the commit is
            # printed by `serve` at startup, so check it is embedded instead of
            # starting a server on every runner.
            - name: Check the server sidecar
              shell: bash
              run: |
                  exe="${{ matrix.exe }}"
                  binary="desktop/src-tauri/binaries/vibe-server-${{ matrix.triple }}$exe"
                  "$binary" --version
                  grep -aq "${{ github.sha }}" "$binary"

            # Linux takes a system ffmpeg; the other platforms bundle one as a
            # sidecar, but only where the model needs it, so this has to match
            # what tauri.*.windows.conf.json and the macOS build expect.
            # Python because the runners' tar differs: macOS has bsdtar, which
            # reads zip; the Windows runner's GNU tar does not.
            - name: Fetch ffmpeg
              if: matrix.ffmpeg != ''
              shell: python
              env:
                  FFMPEG_URL: ${{ matrix.ffmpeg }}
                  TRIPLE: ${{ matrix.triple }}
                  EXE: ${{ matrix.exe }}
              run: |
                  import os
                  import pathlib
                  import urllib.request
                  import zipfile

                  url = os.environ["FFMPEG_URL"]
                  triple = os.environ["TRIPLE"]
                  exe = os.environ["EXE"]
                  tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ffmpeg-download"
                  tmp.mkdir(parents=True, exist_ok=True)
                  archive = tmp / "ffmpeg.zip"
                  urllib.request.urlretrieve(url, archive)
                  with zipfile.ZipFile(archive) as bundle:
                      member = next(
                          name
                          for name in bundle.namelist()
                          if pathlib.PurePosixPath(name).name == "ffmpeg" + exe
                      )
                      bundle.extract(member, tmp / "out")
                  target = pathlib.Path("desktop/src-tauri/binaries") / f"ffmpeg-{triple}{exe}"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  os.replace(tmp / "out" / member, target)
                  os.chmod(target, 0o755)
                  print(f"installed {target}")

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile
              working-directory: ./desktop

            # tauri-action reuses an existing release for the same tag, which is
            # how the five matrix jobs share one release.
            - name: Build and publish
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tagName: ${{ steps.dev-version.outputs.tag }}
                  releaseName: Dev build ${{ steps.dev-version.outputs.version }}
                  releaseBody: ${{ steps.dev-version.outputs.body }}
                  releaseCommitish: ${{ github.sha }}
                  prerelease: true
                  includeUpdaterJson: false
                  args: --target ${{ matrix.triple }} --config ${{ steps.dev-version.outputs.config }}
                  projectPath: ./desktop
                  tauriScript: pnpm exec tauri
