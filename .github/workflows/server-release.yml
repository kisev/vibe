name: Release Server

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example: server-v0.7.0)"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: server

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Server ${{ env.VERSION }}
          # Never the repository's Latest: that badge, the website, and the updater belong to the app.
          prerelease: true
          generate_release_notes: true

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 distribution builds pin the portable AVX floor (the legacy
          # baseline CPU tier); local builds stay native-tuned.
          - runner: ubuntu-24.04
            binary: vibe-server-linux-amd64
            cmake_args: -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF
          - runner: ubuntu-24.04-arm
            binary: vibe-server-linux-arm64
          - runner: macos-14
            binary: vibe-server-darwin-arm64
            package_os: darwin
            package_arch: arm64
            archive: vibe-server-darwin-arm64-with-ffmpeg.tar.gz
          - runner: macos-15-intel
            binary: vibe-server-darwin-amd64
            cargo_flags: --no-default-features
            package_os: darwin
            package_arch: amd64
            archive: vibe-server-darwin-amd64-with-ffmpeg.tar.gz
          - runner: windows-latest
            binary: vibe-server-windows-amd64.exe
            cmake_args: -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF
            package_os: windows
            package_arch: amd64
            archive: vibe-server-windows-amd64-with-ffmpeg.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup chore
        uses: getchore/setup-chore@v1
      # Build-time only: headers + glslc + glslangValidator + SPIRV-Headers
      # cmake config for the ggml Vulkan backend; runtime uses the GPU driver.
      - name: Install Vulkan build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc glslang-tools spirv-headers

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
            curl.exe -L --retry 5 -o VulkanSDK.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
            # choco dropped the vulkansdk package. The LunarG installer is Qt
            # Installer Framework with its headless 'install' command disabled by
            # the vendor, so unknown flags silently fall back to GUI mode. A
            # controller script drives the pages instead; it needs no interaction.
            $controller = "$env:GITHUB_WORKSPACE\.github\vulkan-sdk-controller.qs"
            Start-Process -Wait -FilePath .\VulkanSDK.exe -ArgumentList "--script=$controller"
            if (-not (Test-Path D:\VulkanSDK)) { throw 'D:\VulkanSDK missing after the Vulkan SDK install' }
            $glslc = (Get-ChildItem D:\VulkanSDK -Recurse -Filter glslc.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            if (-not $glslc) { throw 'glslc.exe not found after the Vulkan SDK install' }
            $sdk = Split-Path (Split-Path $glslc)
            "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
            "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build vibe-server
        shell: bash
        env:
          VIBE_SERVER_COMMIT: ${{ github.sha }}
          # Empty on the arm64 and macOS cells; the sys crate pins its own
          # portable floors there. An empty value is a no-op.
          TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          export VIBE_SERVER_VERSION="${VERSION#server-}"
          cargo build -p vibe-server --release ${{ matrix.cargo_flags }}
          src="target/release/vibe-server"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.binary }}"
      - name: Package release bundle with ffmpeg
        if: matrix.archive != ''
        shell: bash
        run: |
          chore package-release "${{ matrix.binary }}" "${{ matrix.package_os }}" "${{ matrix.package_arch }}" "${{ matrix.archive }}"
      - name: Upload packaged archive to release
        if: matrix.archive != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:VERSION" "${{ matrix.archive }}" --clobber
      - name: Upload raw binary to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:VERSION" "${{ matrix.binary }}" --clobber
