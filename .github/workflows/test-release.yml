name: Test Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (leave empty for latest)"
        required: false
        type: string

jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            pattern: vibe_aarch64.app.tar.gz
          - runner: macos-15-intel
            pattern: vibe_x64.app.tar.gz
          - runner: ubuntu-24.04
            pattern: "vibe_*_amd64.deb"
          - runner: ubuntu-24.04-arm
            pattern: "vibe_*_arm64.deb"
          - runner: windows-latest
            pattern: "vibe_*_x64-setup.exe"

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/fixtures

      - name: Setup MSYS2 wget (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          install: wget

      - name: Download latest release artifact (including pre-releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            # Only application releases carry the v-prefixed tag; dev and server
            # prereleases are newer and would otherwise be picked as "latest".
            tag=$(gh release list --repo ${{ github.repository }} --limit 50 --json tagName \
              --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // empty')
          fi
          if [ -z "$tag" ]; then
            echo "::error::no application release found (expected a v-prefixed tag)"
            exit 1
          fi
          echo "Downloading from release: $tag"
          gh release download "$tag" --repo ${{ github.repository }} --pattern "${{ matrix.pattern }}"

      - name: Download tiny whisper model
        if: runner.os != 'Windows'
        shell: bash
        run: |
          wget -q https://huggingface.co/handy-computer/whisper-tiny-gguf/resolve/main/whisper-tiny-Q5_K_M.gguf
          # Same hash transcribe-spike.yml pins for this file.
          echo "72cfa8ee436a635a5b6fb373cc056a828b9efe96d32d6eb8769ed3cc5b429719  whisper-tiny-Q5_K_M.gguf" | sha256sum -c -

      - name: Download tiny whisper model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\wget.exe --progress=bar:force:noscroll https://huggingface.co/handy-computer/whisper-tiny-gguf/resolve/main/whisper-tiny-Q5_K_M.gguf -O whisper-tiny-Q5_K_M.gguf
          $hash = (Get-FileHash -Algorithm SHA256 whisper-tiny-Q5_K_M.gguf).Hash.ToLower()
          if ($hash -ne "72cfa8ee436a635a5b6fb373cc056a828b9efe96d32d6eb8769ed3cc5b429719") { throw "model checksum mismatch: $hash" }

      - name: Extract and test (macOS)
        if: runner.os == 'macOS'
        run: |
          tar xzf ${{ matrix.pattern }}
          ./vibe.app/Contents/MacOS/vibe transcribe whisper-tiny-Q5_K_M.gguf server/fixtures/short.mp4

      - name: Install and test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./${{ matrix.pattern }}
          xvfb-run -a vibe transcribe whisper-tiny-Q5_K_M.gguf server/fixtures/short.mp4

      - name: Install and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-Item vibe_*_x64-setup.exe).FullName
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          & "$env:LOCALAPPDATA\vibe\vibe.exe" transcribe whisper-tiny-Q5_K_M.gguf server\fixtures\short.mp4
