[package]
name = "vibe-diarize-native"
version = "0.1.0"
edition.workspace = true
description = "Nemotron-3-Diarization as a standalone tool vibe-server runs beside itself"
repository.workspace = true
license.workspace = true

# A separate process is what keeps the two GGML stacks apart: vibe-server's
# binary links transcribe.cpp's GGML 0.26, this tool statically links the
# prebuilt GGML 0.22 the native stack is built against, and neither ever sees
# the other's symbols. The prebuilt libraries are not -fPIC, so a shared
# module was not an option either; a plain binary links them as-is.
[[bin]]
name = "vibe-diarize-native"
path = "src/main.rs"

[dependencies]
anyhow = "1"
nemotron-diarize-rs = { path = "../nemotron-diarize-rs" }
hound = "3.5"

# The prebuilt ggml-cpu reads the registry (CPU device context), so the link
# needs advapi32; windows-sys' Registry feature is what carries that link
# directive through to the binary. Upstream's vibe-server gets it transitively
# from its larger dependency graph — this helper's graph is too small.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

[lints]
workspace = true
