[package]
name = "vibe-server"
version = "0.9.0"
edition.workspace = true
description = "Rust CLI and server for local transcription on the GGML runtime"
repository.workspace = true
license.workspace = true

[[bin]]
name = "vibe-server"
path = "src/main.rs"

[dependencies]
# Exact pin: engine upgrades are deliberate events (parity re-run), never a
# cargo update side effect.
transcribe-cpp = { version = "=0.4.1", default-features = false }

anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fs4 = "0.13"
futures-util = "0.3"
hound = "3.5"
humantime = "2"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = {
  version = "1",
  features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
  ]
}
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Metal on Apple targets, matching the legacy build (ggml-rs-sys linked
# ggml-metal + the Metal frameworks there). The feature is a no-op elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }

[target."cfg(windows)".dependencies]
windows-sys = {
  version = "0.61",
  features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
  ]
}

[lints]
workspace = true
