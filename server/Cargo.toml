[workspace]
# vibe-server runs the fork's transcribe.cpp unified engine; the pure-Rust
# crates below are upstream's native stack, restored dormant until stage-2
# wiring routes their models to them (see openspec/changes/sync-upstream-main).
members = [
    "crates/nemotron-diarize-rs",
    "crates/nemotron-rs",
    "crates/parakeet-rs",
    "crates/vibe-server",
    "crates/vad-rs",
    "crates/ggml-rs-sys",
    "crates/whisper-rs",
]
resolver = "2"

[workspace.package]
edition = "2021"
repository = "https://github.com/thewh1teagle/vibe"
license = "MIT"

[workspace.lints.clippy]
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
