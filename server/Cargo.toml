[workspace]
# vibe-server runs the fork's transcribe.cpp unified engine. The pure-Rust
# crates are upstream's native stack; Nemotron diarization is served through
# vibe-diarize-native, a runtime-loaded module (the two GGML builds cannot
# share a binary). The rest stay dormant until their models route to them
# (see openspec/changes/sync-upstream-main).
members = [
    "crates/nemotron-diarize-rs",
    "crates/nemotron-rs",
    "crates/parakeet-rs",
    "crates/vibe-diarize-native",
    "crates/vibe-server",
    "crates/vad-rs",
    "crates/ggml-rs-sys",
    "crates/whisper-rs",
]
resolver = "2"

[workspace.package]
edition = "2021"
repository = "https://github.com/thewh1teagle/vibe"
license = "MIT"

[workspace.lints.clippy]
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
