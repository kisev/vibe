# cargo-deny for the server workspace. Run via `task server:deny`. The desktop
# tree stays locked to upstream pins and is not denied yet; see the change notes.
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"

# Baseline: the server tree is locked to deliberate versions (see
# docs/how-to/update-dependencies.md). These are the known-unpatched ones,
# each with why it is acceptable today; drop the entry when a patch lands.

# zip 3.0 is a build-dependency of utoipa-swagger-ui: it unpacks the pinned
# swagger-ui bundle at build time, never an attacker-controlled archive.
[[advisories.ignore]]
id = "RUSTSEC-2026-0367"
reason = "zip used only at build time on the pinned swagger-ui bundle"

[[advisories.ignore]]
id = "RUSTSEC-2026-0368"
reason = "zip used only at build time on the pinned swagger-ui bundle"

[[advisories.ignore]]
id = "RUSTSEC-2026-0369"
reason = "zip used only at build time on the pinned swagger-ui bundle"

# ZipArchive::extract abort on a crafted symlink entry; no patched 3.x yet.
[[advisories.ignore]]
id = "RUSTSEC-2026-0429"
reason = "zip used only at build time on the pinned swagger-ui bundle"

# tokio AsyncFd constructors are unsound from safe code; the server never
# constructs AsyncFd from a foreign fd, and no patched tokio exists yet
[[advisories.ignore]]
id = "RUSTSEC-2026-0386"
reason = "tokio unsoundness, no patch released; server does not use the unsafe constructors"

[bans]
multiple-versions = "deny"

# Accepted transitive duplicates (per server/Cargo.lock and `cargo tree`):
# windows-sys rides in as 0.52 (errno/rustix via fs4 and tempfile, plus
# winapi-util via walkdir), 0.59 (fs4 and nu-ansi-term via
# tracing-subscriber) and 0.61 (clap's anstream, mio, schannel via
# native-tls, and the direct pin in vibe-server); core-foundation as 0.10.1
# (security-framework via native-tls) and 0.9.4 (system-configuration via
# hyper-util) — both on reqwest's macOS TLS line. Both crates are only
# compiled for their platform, so the cost is build time, not correctness.
[[bans.skip]]
name = "windows-sys"
reason = "three transitive majors pending upstream convergence"

[[bans.skip]]
name = "core-foundation"
reason = "security-framework 0.10.1 vs system-configuration 0.9.4 (both via reqwest on macOS)"

# bindgen (ggml-rs-sys build) pins shlex 1.x while cc takes 2.x; the majors
# cannot converge until bindgen releases a 2.x line
[[bans.skip]]
name = "shlex"
reason = "bindgen 1.x vs cc 2.x lines"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# everything in the server tree resolves from crates.io now; the old eyre
# git fork pin lives only in the desktop crate
allow-git = []
