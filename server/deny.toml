# cargo-deny for the server workspace. Run via `task server:deny`. The desktop
# tree stays locked to upstream pins and is not denied yet; see the change notes.
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"

# Baseline: the server tree is locked to deliberate versions (see
# desktop/BUILDING notes on upgrades). These are the known-unpatched ones,
# each with why it is acceptable today; drop the entry when a patch lands.

# zip 3.0 is a build-dependency of utoipa-swagger-ui: it unpacks the pinned
# swagger-ui bundle at build time, never an attacker-controlled archive.
[[advisories.ignore]]
id = "RUSTSEC-2026-0367"
reason = "zip used only at build time on the pinned swagger-ui bundle"

[[advisories.ignore]]
id = "RUSTSEC-2026-0368"
reason = "zip used only at build time on the pinned swagger-ui bundle"

[[advisories.ignore]]
id = "RUSTSEC-2026-0369"
reason = "zip used only at build time on the pinned swagger-ui bundle"

# paste is unmaintained; transitive via utoipa, no replacement pin available
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "unmaintained transitive of utoipa; no patched release to move to"

# tokio AsyncFd constructors are unsound from safe code; the server never
# constructs AsyncFd from a foreign fd, and no patched tokio exists yet
[[advisories.ignore]]
id = "RUSTSEC-2026-0386"
reason = "tokio unsoundness, no patch released; server does not use the unsafe constructors"

[bans]
multiple-versions = "deny"

# Accepted transitive duplicates: windows-sys rides in on three different
# major-versioned dependents (reqwest, notify and the tauri-era system crates
# have not converged), core-foundation comes via both objc2 (0.10) and
# reqwest's security-framework line (0.9). Both are compile-time-only for the
# non-native target, so the cost is build time, not correctness.
[[bans.skip]]
name = "windows-sys"
reason = "three transitive majors pending upstream convergence"

[[bans.skip]]
name = "core-foundation"
reason = "objc2 0.10 vs security-framework 0.9 lines"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # pinned fork of eyre used by the desktop crate
  "https://github.com/thewh1teagle/eyre",
]
