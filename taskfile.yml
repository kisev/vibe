# Single facade over the three toolchains (pnpm, uv, cargo). Tasks delegate to
# the existing scripts — a script change never needs a task edit. Tools resolve
# through mise; `task hooks` installs the git gates once per checkout.
version: "3"

# CI helper tasks read their inputs from documented environment variables;
# workflows pass them through `env:` rather than as arguments, so values with
# spaces or newlines never reach a shell argument.
vars:
  # The new dev-build script is not tied to an old interpreter name; Windows
  # images expose `python`, while Unix runners use `python3`.
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

tasks:
  hooks:
    desc: Install the lefthook git gates once per checkout
    cmds:
      - mise exec -- lefthook install

  setup:remotes:
    desc: Isolate upstream tags so fetches never collide with the fork's own history
    cmds:
      - |
        git config --unset-all remote.upstream.fetch 2>/dev/null || true
        git config --add remote.upstream.fetch '+refs/heads/*:refs/remotes/upstream/*'
        git config --add remote.upstream.fetch '^refs/tags/*'
        git config remote.upstream.tagOpt --no-tags
        echo "upstream now fetches branches only; fetch tags with: task upstream:tags"

  upstream:fetch:
    desc: Fetch upstream branches only - tags never collide with the fork's own
    cmds:
      - git fetch upstream --prune

  upstream:tags:
    desc: Fetch upstream tags into refs/upstream-tags for comparison (never refs/tags)
    cmds:
      - git fetch upstream '+refs/tags/*:refs/upstream-tags/*'

  i18n:generate:
    desc: Compile paraglide messages for desktop and website
    cmds:
      - pnpm --dir desktop i18n:generate
      - pnpm --dir website i18n:generate

  i18n:stamp:
    desc: Stamp source hashes into translated content
    cmds:
      - uv run scripts/content_i18n.py stamp

  i18n:audit:
    desc: Full i18n coverage audit
    cmds:
      - uv run scripts/check_i18n.py

  docs:models:
    desc: Regenerate the models docs from the catalog
    cmds:
      - pnpm --dir desktop docs:models

  docs:models:check:
    desc: Fail when the generated models docs are stale
    cmds:
      - pnpm --dir desktop exec node scripts/generate-models-docs.mjs check

  sync:catalog:
    desc: Refresh the vendored handy catalog copy
    cmds:
      - pnpm --dir desktop sync:catalog

  sync:catalog:check:
    desc: Fail when the vendored catalog copy is stale
    cmds:
      - pnpm --dir desktop check:catalog

  desktop:test:
    desc: Desktop unit tests
    cmds:
      - pnpm --dir desktop test

  desktop:typecheck:
    desc: Desktop type check
    cmds:
      - pnpm --dir desktop exec tsc --noEmit

  website:test:
    desc: Website unit tests
    cmds:
      - pnpm --dir website test

  website:typecheck:
    desc: Website type check (build)
    cmds:
      - pnpm --dir website run build

  server:test:
    desc: Server unit tests
    dir: server
    cmds:
      - cargo test -p vibe-server

  server:fmt:
    desc: rustfmt the server workspace
    cmds:
      - cargo fmt --all -- server

  server:deny:
    desc: cargo-deny check for the server workspace
    dir: server
    cmds:
      - mise exec -- cargo deny check

  server:machete:
    desc: Find unused Rust dependencies in the server workspace
    dir: server
    cmds:
      - mise exec -- cargo machete

  server:clippy:
    desc: Clippy the fork-owned server crates, warnings fatal
    dir: server
    cmds:
      # The dormant upstream crates are vendored byte-for-byte; their lint
      # cleanliness is upstream's CI (upstream never lints server/ — its root
      # workspace excludes it). New fork-owned crates join -p here; ggml-rs-sys
      # carries the one fork-side allow line for its generated bindings.
      - cargo clippy -p vibe-server -p vibe-diarize-native --all-targets -- -D warnings

  test:
    desc: All unit suites
    cmds:
      - task: desktop:test
      - task: website:test
      - task: server:test

  lint:
    desc: Run every linter (whole tree)
    cmds:
      - task: lint:yaml
      - task: lint:toml
      - task: lint:md
      - task: lint:json
      - task: lint:js
      - task: lint:shell
      - task: lint:editorconfig
      - task: lint:workflows
      - task: lint:secrets

  lint:yaml:
    cmds:
      - mise exec -- fd -H -e yml -e yaml -E node_modules -E desktop/src/paraglide -E desktop/src-tauri/gen -X yamllint

  lint:toml:
    cmds:
      - mise exec -- fd -H -e toml -E node_modules -E Cargo.toml -E desktop/project.inlang -E website/project.inlang -X tombi lint

  lint:md:
    cmds:
      - mise exec -- fd -H -e md -E node_modules -E desktop/src/paraglide -E .claude -E .opencode -E .agents -E models.md -E i18n/changelog -X markdownlint-cli2 --no-globs

  lint:json:
    cmds:
      - >-
        mise exec -- fd -H -e json -E node_modules -E desktop/src/paraglide -E desktop/src-tauri/gen -E desktop/src/data/handy-catalog.json
        -E desktop/project.inlang -E website/project.inlang -X
        oxfmt --check

  lint:js:
    cmds:
      - mise exec -- fd -H -e ts -e tsx -e js -e mjs -E node_modules -E desktop/src/paraglide -X oxlint

  lint:shell:
    cmds:
      # installer.sh is upstream's script; its SC2024 info (sudo </dev/tty
      # redirect) is upstream's call, re-checked on every sync
      - mise exec -- fd -H -e sh -E node_modules -E website/public/installer.sh -X shfmt -i 4 -d
      - mise exec -- fd -H -e sh -E node_modules -E website/public/installer.sh -X shellcheck

  lint:editorconfig:
    cmds:
      # server/libs and the engine export scripts are vendored from upstream
      # byte-for-byte; their formatting is upstream's, re-checked on every sync
      - mise exec -- fd -H -t f -E node_modules -E desktop/src/paraglide -E desktop/src-tauri/gen -E server/libs -E "server/crates/*/scripts" -X editorconfig-checker

  lint:workflows:
    cmds:
      - mise exec -- actionlint

  lint:secrets:
    cmds:
      - mise exec -- gitleaks git --config .gitleaks.toml --redact --no-banner
      - mise exec -- trivy fs --scanners secret --exit-code 1 --secret-config trivy-secret.yaml .

  format:
    desc: Format everything in place
    cmds:
      - task: format:md
      - task: format:json
      - mise exec -- fd -H -e sh -E node_modules -X shfmt -i 4 -w
      - mise exec -- fd -H -e toml -E node_modules -E Cargo.toml -E desktop/project.inlang -E website/project.inlang -X tombi format
      - mise exec -- fd -H -e css -e html -E node_modules -X prettier --write

  format:md:
    cmds:
      - mise exec -- fd -H -e md -E node_modules -E desktop/src/paraglide -E .claude -E .opencode -E .agents -E models.md -E i18n/changelog -X mdformat

  format:json:
    cmds:
      - >-
        mise exec -- fd -H -e json -E node_modules -E desktop/src/paraglide -E desktop/src-tauri/gen -E desktop/src/data/handy-catalog.json
        -E desktop/project.inlang -E website/project.inlang -X
        oxfmt

  format:check:
    desc: Fail when anything is unformatted
    cmds:
      - mise exec -- fd -H -e md -E node_modules -E desktop/src/paraglide -E .claude -E .opencode -E .agents -E models.md -E i18n/changelog -X mdformat --check
      - >-
        mise exec -- fd -H -e json -E node_modules -E desktop/src/paraglide -E desktop/src-tauri/gen -E desktop/src/data/handy-catalog.json
        -E desktop/project.inlang -E website/project.inlang -X
        oxfmt --check
      - mise exec -- fd -H -e sh -E node_modules -X shfmt -i 4 -d
      - mise exec -- fd -H -e toml -E node_modules -E Cargo.toml -E pyproject.toml -E desktop/project.inlang -E website/project.inlang -X tombi format --check
      - mise exec -- fd -H -e css -e html -E node_modules -X prettier --check

  deps:check:
    desc: Report outdated dependencies across Cargo, pnpm and uv (read-only)
    cmds:
      - |
        status=0
        for manifest in Cargo.toml server/Cargo.toml handoff/wasm/Cargo.toml handoff/probe/Cargo.toml; do
          echo
          echo "== cargo: $manifest =="
          mise exec -- cargo outdated --workspace --manifest-path "$manifest" || status=1
        done
        for dir in desktop website handoff/pwa; do
          echo
          echo "== pnpm: $dir =="
          rc=0
          pnpm --dir "$dir" outdated || rc=$?
          # pnpm exits 1 when it found outdated packages; anything higher is a failure.
          [ "$rc" -le 1 ] || status=$rc
        done
        echo
        echo "== uv: vibe-scripts =="
        uv sync --locked --quiet && uv pip list --outdated || status=1
        exit "$status"

  deps:update:
    desc: Update dependencies within their declared ranges (lockfiles unless a range blocks)
    cmds:
      - |
        for manifest in Cargo.toml server/Cargo.toml handoff/wasm/Cargo.toml handoff/probe/Cargo.toml; do
          echo
          echo "== cargo update: $manifest =="
          cargo update --manifest-path "$manifest"
        done
        for dir in desktop website handoff/pwa; do
          echo
          echo "== pnpm update: $dir =="
          pnpm --dir "$dir" update
        done
        echo
        echo "== uv lock --upgrade =="
        uv lock --upgrade

  deps:update:major:
    desc: Upgrade across major versions (review the diff; never run automatically)
    prompt: This crosses major versions in every ecosystem. Review the resulting diff before merging. Continue?
    cmds:
      - |
        for manifest in Cargo.toml server/Cargo.toml handoff/wasm/Cargo.toml handoff/probe/Cargo.toml; do
          echo
          echo "== cargo upgrade --incompatible: $manifest =="
          mise exec -- cargo upgrade --incompatible --manifest-path "$manifest"
        done
        for dir in desktop website handoff/pwa; do
          echo
          echo "== pnpm update --latest: $dir =="
          pnpm --dir "$dir" update --latest
        done

  deps:renovate:dry:
    desc: Show the updates Renovate would apply locally (no token, touches nothing)
    cmds:
      - |
        RENOVATE_CONFIG_FILE=renovate.json LOG_LEVEL=info \
          mise exec -- renovate --platform=local --dry-run

  deps:renovate:
    desc: Apply Renovate's updates to the working tree (review the diff, then commit)
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "the working tree is dirty; commit or stash your changes before applying dependency updates" >&2
          exit 1
        fi
        RENOVATE_CONFIG_FILE=renovate.json LOG_LEVEL=info \
          mise exec -- renovate --platform=local

  ci:e2e:
    desc: Run the desktop browser-mode end-to-end suite
    dir: desktop
    cmds:
      - pnpm exec playwright install --with-deps chromium
      - pnpm exec playwright test

  ci:vulkan-deps:
    desc: Install the Vulkan build prerequisites on the lint runner (3 bounded attempts)
    cmds:
      - bash scripts/ci/vulkan-deps.sh

  ci:vulkan-noble:
    desc: Install Vulkan build prerequisites from noble apt (Ubuntu arm build)
    cmds:
      - bash scripts/ci/vulkan-noble.sh

  ci:vulkan-jammy:
    desc: Install the LunarG Vulkan SDK on jammy (Ubuntu x86_64 build)
    cmds:
      - bash scripts/ci/vulkan-jammy.sh

  ci:vulkan-sdk-windows:
    desc: Install the Vulkan SDK on a Windows runner (VULKAN_VERSION)
    cmds:
      - pwsh -NoProfile -File scripts/ci/vulkan-sdk-windows.ps1

  ci:linux-build-deps:
    desc: Install the Linux desktop build dependencies
    cmds:
      - bash scripts/ci/linux-build-deps.sh

  ci:ggml-libs:
    desc: Fetch the pinned prebuilt ggml libraries (TRIPLE)
    cmds:
      - bash scripts/ci/ggml-libs.sh

  ci:diarize-helper:
    desc: Build the native diarization helper and stage it as a sidecar (TRIPLE, EXE)
    cmds:
      - bash scripts/ci/diarize-helper.sh

  ci:fetch-ffmpeg:
    desc: Fetch the bundled ffmpeg sidecar (FFMPEG_URL, TRIPLE, EXE, RUNNER_TEMP)
    cmds:
      # `python` is what the old Actions `shell: python` used on every platform.
      - python scripts/ci/fetch_ffmpeg.py

  ci:build-server:
    desc: Build vibe-server and stage it as the desktop sidecar (TRIPLE, EXE, VIBE_SERVER_VERSION, VIBE_SERVER_COMMIT, TRANSCRIBE_CMAKE_ARGS)
    cmds:
      - bash scripts/ci/build-server.sh

  ci:check-server:
    desc: Check the server sidecar reports its version and embeds the commit (TRIPLE, EXE, GITHUB_SHA)
    cmds:
      - bash scripts/ci/check-server.sh

  ci:macos-signing-env:
    desc: Export the Apple signing secrets into GITHUB_ENV (APPLE_*)
    cmds:
      - bash scripts/ci/macos-signing-env.sh

  ci:changelog-gate:
    desc: Require i18n/changelog/<version>.md for the version being released
    cmds:
      - bash scripts/ci/changelog-gate.sh

  ci:frontend-deps:
    desc: Install the desktop and website frontend dependencies
    cmds:
      - pnpm --dir desktop install --frozen-lockfile
      - pnpm --dir website install --frozen-lockfile

  ci:desktop-build-deps:
    desc: Install the desktop crate's build prerequisites on Ubuntu
    cmds:
      - bash scripts/ci/desktop-build-deps.sh

  ci:desktop-check:
    desc: Type-check the desktop crate with placeholder sidecars (Ubuntu)
    cmds:
      - bash scripts/ci/desktop-check.sh

  dev:guard:
    desc: Fail unless this dev build's commit is contained in the dev branch
    cmds:
      - '{{.PYTHON}} scripts/dev_build.py guard'

  dev:prepare:
    desc: Compute the dev version, tag, tauri config and release body into GITHUB_OUTPUT
    cmds:
      - '{{.PYTHON}} scripts/dev_build.py prepare'

  dev:cleanup:
    desc: Prune old dev releases with bounded retention (KEEP, KEEP_COUNT, KEEP_HOURS, GH_TOKEN, GITHUB_RUN_ID, GITHUB_REPOSITORY)
    cmds:
      - '{{.PYTHON}} scripts/dev_build.py cleanup'

  dev:deploy-website:
    desc: Dispatch the website deploy so the dev manifest refreshes (GH_TOKEN, GITHUB_REPOSITORY)
    cmds:
      - gh workflow run website.yml --ref main --repo "$GITHUB_REPOSITORY"

  release:set-version:
    desc: Validate and apply the release version override to tauri.conf.json (VERSION, GITHUB_REF)
    cmds:
      - python3 scripts/release_set_version.py

  release:notes:
    desc: Assemble the GitHub release body - English notes under the website changelog link (VERSION, RELEASE_NOTES; stdout when unset)
    cmds:
      - '{{.PYTHON}} scripts/release_notes.py'

  dev:tag:
    desc: Cut a dev build - tag dev.<next> on the dev branch and push the tag
    cmds:
      - git fetch origin main dev --tags --prune --prune-tags
      - |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" != "dev" ]; then
          echo "dev tags are cut on the dev branch only (on $branch now): git switch dev && git merge --ff-only main" >&2
          exit 1
        fi
        next=$(git tag -l 'dev.*' | sed 's/dev\.//' | sort -n | tail -1)
        next=$((next + 1))
        git tag -s "dev.$next" -m "Dev build $next"
        git push origin "dev.$next"
        echo "tagged dev.$next — watch the Dev Build workflow"
