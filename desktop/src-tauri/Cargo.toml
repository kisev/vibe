[package]
name = "vibe"
version = "0.0.6"
description = "Vibe"
authors = ["@thewh1teagle"]
license = "MIT"
repository = "https://github.com/thewh1teagle/vibe"
edition = "2021"

[dependencies]
meeting-detect = { path = "../../crates/meeting-detect" }
tauri = { version = "2", features = ["devtools", "macos-private-api", "protocol-asset", "tray-icon"] }

tauri-plugin-aptabase = {
  git = "https://github.com/vibe-transcribe/tauri-plugin-aptabase",
  branch = "deterministic-daily-session"
}
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
# Unsafe headers required for Ollama (to set Origin)
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
# Plugins
tauri-plugin-window-state = "2"

# Keep-awake, used directly rather than via tauri-plugin-keepawake (which only wraps it).
keepawake = "0.6.1"

eyre = { workspace = true }
serde_json = { workspace = true }

bytes = "1"
cpal = { git = "https://github.com/thewh1teagle/cpal", branch = "feat/macos-system-audio-permission-check" }
futures = "0.3.31"
futures-util = "0.3"
hound = "3.5.1"
once_cell = "1.21.3"
rand = "0.9.2"
serde = { version = "^1.0.228", features = ["derive"] }
# Verify downloaded models against the catalog hash
sha2 = "0.10"
showfile = "0.1.1"
tokio = { version = "1.49.0", features = ["fs", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
url = "2.5.8"
# Anonymous, locally generated analytics install id
uuid = { version = "1", features = ["v4"] }

# HTTP client for server communication and downloads
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }

glob = "0.3.3"
# Watch app_config.json for edits made outside the app
notify = "8"
# Log
tracing = { version = "0.1.44", features = ["log"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

bytemuck = "1.24.0"
chrono = "0.4.43"
crash-handler = "0.7.0"
enigo = "0.3"
urlencoding = "2.1.3"
which = "8"

hex = "0.4"
# Phone handoff (iroh p2p)
iroh = "1"
subtle = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.75", features = ["vendored"] }

# macOS
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSWindow"] }
objc2-av-foundation = {
  version = "0.3.2",
  default-features = false,
  features = ["AVCaptureDevice", "AVMediaFormat", "block2", "std"]
}
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel.git", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
window-vibrancy = "0.6"

# Windows
[target."cfg(windows)".dependencies]
# Used to redirect stdout/stderr from c++ to the attached console
libc = "0.2.180"
libc-stdhandle = "=0.1.0"
# Used to attach to console
windows = {
  version = "0.62.2",
  features = [
    "Win32_Foundation",
    "Win32_System_Console",
  ]
}
winreg = "0.55.0"

[features]
default = []
